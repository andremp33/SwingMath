name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # Store, account and contact settings: repository Actions variables (or secrets).
          # The store buttons on the website ("coming soon" until set).
          VITE_APP_STORE_URL: ${{ vars.VITE_APP_STORE_URL || secrets.VITE_APP_STORE_URL }}
          VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL || secrets.VITE_PLAY_STORE_URL }}
          # The project's URL and anon key are public by design (they ship in
          # the site's JavaScript); the database rules protect the data.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || 'https://cplvbecwurnzutxxsngu.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwbHZiZWN3dXJuenV0eHhzbmd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MDEwODcsImV4cCI6MjEwNzA3NzA4N30.1_xrjUT3Yu7gemGSMljCyne5zyxgpDmxxOcTUcttfF0' }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL || secrets.VITE_SUPPORT_EMAIL }}
          VITE_OWNER_NAME: ${{ vars.VITE_OWNER_NAME || secrets.VITE_OWNER_NAME }}
          VITE_OWNER_ADDRESS: ${{ vars.VITE_OWNER_ADDRESS || secrets.VITE_OWNER_ADDRESS }}
      # Shared setups load the site through the 404 page; the pages the
      # stores link to get a copy of their own, so they answer 200.
      - run: |
          cp dist/index.html dist/404.html && touch dist/.nojekyll
          for p in privacidade termos suporte apagar-conta; do mkdir -p "dist/$p" && cp dist/index.html "dist/$p/index.html"; done
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
