name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # Store and contact settings, from the repository's Actions variables.
          VITE_LS_STORE_ID: ${{ vars.VITE_LS_STORE_ID }}
          VITE_LS_CHECKOUT_MONTHLY: ${{ vars.VITE_LS_CHECKOUT_MONTHLY }}
          VITE_LS_CHECKOUT_ANNUAL: ${{ vars.VITE_LS_CHECKOUT_ANNUAL }}
          VITE_LS_PORTAL_URL: ${{ vars.VITE_LS_PORTAL_URL }}
          VITE_PRICE_MONTHLY: ${{ vars.VITE_PRICE_MONTHLY }}
          VITE_PRICE_ANNUAL: ${{ vars.VITE_PRICE_ANNUAL }}
          VITE_PRICE_CURRENCY: ${{ vars.VITE_PRICE_CURRENCY }}
          VITE_TRIAL_DAYS: ${{ vars.VITE_TRIAL_DAYS }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_OWNER_NAME: ${{ vars.VITE_OWNER_NAME }}
      # Deep links (/SwingMath/rackets, shared setups) load the app too.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
